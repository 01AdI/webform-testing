<h1>Zoho Plain Webform Test</h1>

<div id="crmWebToEntityForm" class="zcwf_lblLeft crmWebToEntityForm">

  <form
    id="webform1445244000000633002"
    name="WebToLeads1445244000000633002"
    action="https://crm.zoho.in/crm/WebToLeadForm"
    method="POST"
    accept-charset="UTF-8"
    onsubmit='document.charset="UTF-8"; return checkMandatory1445244000000633002();'
  >

    <!-- Zoho-generated hidden fields -->
    <input
      type="hidden"
      name="xnQsjsdp"
      value="b31e75cb48b79ff102e3b8d674aec4c6ea4d9f19ebdf7c1fab3df88cc1618ae7"
    >

    <input type="hidden" name="zc_gad" id="zc_gad" value="">

    <input

    >

    <input type="hidden" name="actionType" value="TGVhZHM=">

    >

    <!-- Last Name: Mandatory -->
    <div class="form-field">
      <label for="Last_Name">
        Last Name <span class="required">*</span>
      </label>
      <input
        type="text"
        id="Last_Name"
        name="Last Name"
        maxlength="80"
        aria-required="true"
        required
      >
    </div>

    <!-- Company: Mandatory -->
    <div class="form-field">
      <label for="Company">
        Company <span class="required">*</span>
      </label>
      <input
        type="text"
        id="Company"
        name="Company"
        maxlength="200"
        aria-required="true"
        required
      >
    </div>

    <!-- Mobile Number: Optional -->
    <div class="form-field">
      <label for="Phone">Mobile Number</label>
      <input
        type="tel"
        id="Phone"
        name="Phone"
        maxlength="30"
        aria-required="false"
      >
    </div>

    <!-- Email: Optional -->
    <div class="form-field">
      <label for="Email">Email</label>
      <input
        type="email"
        id="Email"
        name="Email"
        maxlength="100"
        aria-required="false"
      >
    </div>

    <!-- Lead Source: Website -->
    <div style="display:none;">
      <select id="Lead_Source" name="Lead Source" aria-label="Lead Source">
        <option value="-None-">-None-</option>
        <option selected value="Website">Website</option>
      </select>

    <input
      type="hidden"

    >

    <!-- Buttons -->
    <div class="form-field">
      <input
        type="submit"
        id="formsubmit"
        class="formsubmit zcwf_button"
        value="Submit"
        aria-label="Submit"
      >

      <input
        type="reset"
        class="zcwf_button"
        name="reset"
        value="Reset"
        aria-label="Reset"
      >
    </div>

    <script>
      function validateEmail1445244000000633002() {
        var form = document.forms[
          'WebToLeads1445244000000633002'
        ];

        var emailFld = form.querySelectorAll('[type="email"]');

        for (var i = 0; i < emailFld.length; i++) {
          var emailVal = emailFld[i].value.trim();

          if (emailVal.length !== 0) {
            var atpos = emailVal.indexOf('@');
            var dotpos = emailVal.lastIndexOf('.');

            if (
              atpos < 1 ||
              dotpos < atpos + 2 ||
              dotpos + 2 >= emailVal.length
            ) {
              alert('Please enter a valid email address.');
              emailFld[i].focus();
              return false;
            }
          }
        }

        return true;
      }

      function checkMandatory1445244000000633002() {
        var form = document.forms[
          'WebToLeads1445244000000633002'
        ];

        var mndFileds = ['Last Name', 'Company'];

        for (var i = 0; i < mndFileds.length; i++) {
          var fieldObj = form.elements[mndFileds[i]];

          if (!fieldObj || !fieldObj.value.trim()) {
            alert(mndFileds[i] + ' cannot be empty.');

            if (fieldObj) {
              fieldObj.focus();
            }

            return false;
          }
        }

        if (!validateEmail1445244000000633002()) {
          return false;
        }

        document.getElementById('formsubmit').disabled = true;

        return true;
      }

      _wFa_ajax_will_be_replaced = false;

      if (typeof _wfa_fstprtcken === 'undefined') {

      }

      _wfa_fstprtcken[1445244000000633002] = true;
    </script>

    ></script>

</div>
